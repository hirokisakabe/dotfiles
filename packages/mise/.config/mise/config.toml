[tools]
dotnet = "10.0.402"
node = "26.12.1"
python = "3.15.1"
terraform = "1.17.0"
"npm:aze-cli" = "0.5.5"
"npm:agent-browser" = "0.39.2"
"npm:@bkmk/cli" = "0.1.1"
"npm:neon" = "8.11.1"
"npm:shirube" = { version = "1.3.1", allow_builds = ["better-sqlite3"] }
"npm:socket" = "1.10.1"
"npm:tascal-cli" = "0.2.0"
"npm:vercel" = "65.2.0"
# Native dependencies of these tools do not yet support Python 3.15.
"pipx:drawio2pptx" = { version = "0.0.7", uvx_args = "--python 3.14" }
"pipx:headroom-ai" = { version = "0.41.0", extras = "proxy", uvx_args = "--python 3.14" }
"pipx:openhands" = { version = "1.16.0", uvx_args = "--python 3.12" }
# Pin the GitHub release tag; v1.2.3 declares specify-cli 1.2.3 in pyproject.toml.
"pipx:github/spec-kit" = "v1.2.3"
"pipx:twitter-cli" = "0.8.5"

[settings]
idiomatic_version_file_enable_tools = ["python", "node"]

# API keys for local AI agents — set values in ~/.config/mise/config.local.toml (gitignored)
# mise exports [env] entries as shell env vars; `openhands serve` inherits them automatically.
# [env]
# LLM_API_KEY = ""  # OpenHands: Anthropic / OpenAI / etc.
